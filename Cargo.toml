[package]
name = "shiodoki"
version = "0.1.0"
edition = "2024"
description = "Run a thing while its moment lasts, and let it go once the moment has passed"
repository = "https://github.com/yoshzucker/shiodoki"
readme = "README.md"

[dependencies]
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
