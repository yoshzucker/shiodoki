[package]
name = "shiodoki"
version = "0.1.0"
edition = "2024"
description = "Run a thing while its moment lasts, and let it go once the moment has passed"
repository = "https://github.com/yoshzucker/shiodoki"
readme = "README.md"
default-run = "shiodoki"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
if-addrs = "0.15"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_Threading", "Win32_NetworkManagement_WiFi"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
